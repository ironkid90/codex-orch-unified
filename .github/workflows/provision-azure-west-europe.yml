name: Provision Azure Baseline (West Europe)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Set to true to run provisioning"
        required: true
        default: false
        type: boolean
      deploy_foundry:
        description: "Provision optional Foundry container app"
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-provision-weu
  cancel-in-progress: false

env:
  AZURE_LOCATION: westeurope
  AZURE_ENV_NAME: ${{ secrets.AZURE_ENV_NAME }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
  AZURE_CONTAINERAPPS_ENV_NAME: ${{ secrets.AZURE_CONTAINERAPPS_ENV_NAME }}
  AZURE_WEB_APP_NAME: ${{ secrets.AZURE_WEB_APP_NAME }}
  AZURE_WORKER_APP_NAME: ${{ secrets.AZURE_WORKER_APP_NAME }}
  AZURE_FOUNDRY_APP_NAME: ${{ secrets.AZURE_FOUNDRY_APP_NAME }}
  AZURE_APPINSIGHTS_NAME: ${{ secrets.AZURE_APPINSIGHTS_NAME }}
  AZURE_LOG_ANALYTICS_NAME: ${{ secrets.AZURE_LOG_ANALYTICS_NAME }}
  AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
  AZURE_KEY_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
  AZURE_REDIS_NAME: ${{ secrets.AZURE_REDIS_NAME }}
  AZURE_POSTGRES_SERVER_NAME: ${{ secrets.AZURE_POSTGRES_SERVER_NAME }}
  AZURE_POSTGRES_DB_NAME: ${{ secrets.AZURE_POSTGRES_DB_NAME }}
  AZURE_POSTGRES_ADMIN_LOGIN: ${{ secrets.AZURE_POSTGRES_ADMIN_LOGIN }}
  AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: azure-prod
    steps:
      - name: Guard apply toggle
        run: |
          if [[ "${{ github.event.inputs.apply }}" != "true" ]]; then
            echo "apply input must be true."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install azd
        uses: Azure/setup-azd@v1

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --tags stack=codex-orchestrator managedBy=github-actions

      - name: Select or create azd environment
        run: |
          if azd env list --output json | jq -e ".[] | select(.Name == \"$AZURE_ENV_NAME\")" > /dev/null; then
            azd env select "$AZURE_ENV_NAME"
          else
            azd env new "$AZURE_ENV_NAME" --no-prompt
          fi

      - name: Set azd environment values
        run: |
          azd env set AZURE_ENV_NAME "$AZURE_ENV_NAME"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
          azd env set AZURE_ACR_NAME "$AZURE_ACR_NAME"
          azd env set AZURE_CONTAINERAPPS_ENV_NAME "$AZURE_CONTAINERAPPS_ENV_NAME"
          azd env set AZURE_WEB_APP_NAME "$AZURE_WEB_APP_NAME"
          azd env set AZURE_WORKER_APP_NAME "$AZURE_WORKER_APP_NAME"
          azd env set AZURE_FOUNDRY_APP_NAME "$AZURE_FOUNDRY_APP_NAME"
          azd env set AZURE_DEPLOY_FOUNDRY "${{ github.event.inputs.deploy_foundry }}"
          azd env set AZURE_APPINSIGHTS_NAME "$AZURE_APPINSIGHTS_NAME"
          azd env set AZURE_LOG_ANALYTICS_NAME "$AZURE_LOG_ANALYTICS_NAME"
          azd env set AZURE_STORAGE_ACCOUNT_NAME "$AZURE_STORAGE_ACCOUNT_NAME"
          azd env set AZURE_KEY_VAULT_NAME "$AZURE_KEY_VAULT_NAME"
          azd env set AZURE_REDIS_NAME "$AZURE_REDIS_NAME"
          azd env set AZURE_POSTGRES_SERVER_NAME "$AZURE_POSTGRES_SERVER_NAME"
          azd env set AZURE_POSTGRES_DB_NAME "$AZURE_POSTGRES_DB_NAME"
          azd env set AZURE_POSTGRES_ADMIN_LOGIN "$AZURE_POSTGRES_ADMIN_LOGIN"
          azd env set AZURE_POSTGRES_ADMIN_PASSWORD "$AZURE_POSTGRES_ADMIN_PASSWORD"

      - name: Provision infra with azd
        run: azd provision --no-prompt

      - name: Show deployed outputs
        run: |
          echo "Resource group: $AZURE_RESOURCE_GROUP"
          az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$(az deployment group list --resource-group "$AZURE_RESOURCE_GROUP" --query "[0].name" -o tsv)" \
            --query "properties.outputs"

